<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FPL Insights</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #0f1419;
      color: #e6e6e6;
    }
    h1 { color: #4fc3f7; }
    h2 { color: #ffb74d; margin-top: 2rem; }
    .meta { color: #888; font-size: 0.9rem; }
    .controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin: 1rem 0;
    }
    .controls label { color: #888; font-size: 0.9rem; }
    .controls input {
      background: #1a1f26;
      color: #e6e6e6;
      border: 1px solid #2a2f36;
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      font: inherit;
      width: 10ch;
    }
    .controls button {
      background: #4fc3f7;
      color: #0f1419;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 4px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .controls button:hover { background: #29b6f6; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
    }
    th, td {
      text-align: left;
      padding: 0.5rem;
      border-bottom: 1px solid #2a2f36;
    }
    th { color: #888; font-weight: normal; font-size: 0.85rem; text-transform: uppercase; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .loading { color: #888; font-style: italic; }
    .error { color: #ef5350; }
  </style>
</head>
<body>
  <h1>FPL Insights</h1>

  <div class="controls">
    <label for="league-input">League ID:</label>
    <input type="number" id="league-input" min="1" />
    <button id="load-button">Load</button>
  </div>

  <p class="meta" id="meta">Loading…</p>

  <section>
    <h2>Template players (≥70% owned)</h2>
    <table>
      <thead>
        <tr><th>Player</th><th class="num">Owned</th><th class="num">%</th></tr>
      </thead>
      <tbody id="template-body">
        <tr><td colspan="3" class="loading">Loading…</td></tr>
      </tbody>
    </table>
  </section>

  <section>
    <h2>Differentials (5–25% owned)</h2>
    <table>
      <thead>
        <tr><th>Player</th><th class="num">Owned</th><th class="num">%</th></tr>
      </thead>
      <tbody id="differentials-body">
        <tr><td colspan="3" class="loading">Loading…</td></tr>
      </tbody>
    </table>
  </section>

  <script>
    const API = "https://fpl-in.fly.dev";
    const DEFAULT_LEAGUE_ID = 314;

    const input = document.getElementById("league-input");
    const button = document.getElementById("load-button");
    const meta = document.getElementById("meta");
    const templateBody = document.getElementById("template-body");
    const diffBody = document.getElementById("differentials-body");

    function getLeagueFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get("league"), 10);
      return Number.isInteger(id) && id > 0 ? id : DEFAULT_LEAGUE_ID;
    }

    function setLeagueInUrl(leagueId) {
      const url = new URL(window.location);
      url.searchParams.set("league", leagueId);
      window.history.replaceState({}, "", url);
    }

    async function load(leagueId) {
      meta.textContent = `Loading league ${leagueId}…`;
      templateBody.innerHTML = `<tr><td colspan="3" class="loading">Loading…</td></tr>`;
      diffBody.innerHTML = `<tr><td colspan="3" class="loading">Loading…</td></tr>`;

      try {
        const response = await fetch(`${API}/league/${leagueId}/differentials`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        meta.textContent = `Gameweek ${data.gameweek} — ${data.league_name} (${data.total_managers} managers)`;
        renderRows(templateBody, data.template);
        renderRows(diffBody, data.differentials);
      } catch (err) {
        meta.innerHTML = `<span class="error">Failed to load league ${leagueId}: ${err.message}</span>`;
        templateBody.innerHTML = "";
        diffBody.innerHTML = "";
      }
    }

    function renderRows(tbody, players) {
      tbody.innerHTML = "";
      if (players.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="loading">No players in this range.</td></tr>`;
        return;
      }
      for (const p of players) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${p.name}</td>
          <td class="num">${p.count}/${p.total}</td>
          <td class="num">${p.ownership_pct}%</td>
        `;
        tbody.appendChild(tr);
      }
    }

    function handleLoad() {
      const leagueId = parseInt(input.value, 10);
      if (!Number.isInteger(leagueId) || leagueId < 1) {
        meta.innerHTML = `<span class="error">Enter a valid league ID.</span>`;
        return;
      }
      setLeagueInUrl(leagueId);
      load(leagueId);
    }

    button.addEventListener("click", handleLoad);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleLoad();
    });

    // Initial load: from URL or default
    const initialLeague = getLeagueFromUrl();
    input.value = initialLeague;
    load(initialLeague);
  </script>
</body>
</html>
