<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FPL Insights</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #0f1419;
      color: #e6e6e6;
    }
    h1 { color: #4fc3f7; }
    h2 { color: #ffb74d; margin-top: 2rem; }
    .meta { color: #888; font-size: 0.9rem; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
    }
    th, td {
      text-align: left;
      padding: 0.5rem;
      border-bottom: 1px solid #2a2f36;
    }
    th { color: #888; font-weight: normal; font-size: 0.85rem; text-transform: uppercase; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .loading { color: #888; font-style: italic; }
    .error { color: #ef5350; }
  </style>
</head>
<body>
  <h1>FPL Insights</h1>
  <p class="meta" id="meta">Loading…</p>

  <section>
    <h2>Template players (≥70% owned)</h2>
    <table>
      <thead>
        <tr><th>Player</th><th class="num">Owned</th><th class="num">%</th></tr>
      </thead>
      <tbody id="template-body">
        <tr><td colspan="3" class="loading">Loading…</td></tr>
      </tbody>
    </table>
  </section>

  <section>
    <h2>Differentials (5–25% owned)</h2>
    <table>
      <thead>
        <tr><th>Player</th><th class="num">Owned</th><th class="num">%</th></tr>
      </thead>
      <tbody id="differentials-body">
        <tr><td colspan="3" class="loading">Loading…</td></tr>
      </tbody>
    </table>
  </section>

  <script>
    const API = "http://localhost:8000";
    const LEAGUE_ID = 314;

    async function load() {
      const meta = document.getElementById("meta");
      const templateBody = document.getElementById("template-body");
      const diffBody = document.getElementById("differentials-body");

      try {
        const response = await fetch(`${API}/league/${LEAGUE_ID}/differentials`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        meta.textContent = `Gameweek ${data.gameweek} — League ${data.league_id} (${data.total_managers} managers)`;
        renderRows(templateBody, data.template);
        renderRows(diffBody, data.differentials);
      } catch (err) {
        meta.innerHTML = `<span class="error">Failed to load: ${err.message}</span>`;
        templateBody.innerHTML = "";
        diffBody.innerHTML = "";
      }
    }

    function renderRows(tbody, players) {
      tbody.innerHTML = "";
      for (const p of players) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${p.name}</td>
          <td class="num">${p.count}/${p.total}</td>
          <td class="num">${p.ownership_pct}%</td>
        `;
        tbody.appendChild(tr);
      }
    }

    load();
  </script>
</body>
</html>
