<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FPL Insights</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #0f1419;
      color: #e6e6e6;
    }
    h1 { color: #4fc3f7; }
    h2 { color: #ffb74d; margin-top: 2rem; }
    .meta { color: #888; font-size: 0.9rem; }
    .controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin: 1rem 0;
    }
    .controls label { color: #888; font-size: 0.9rem; }
    .controls input {
      background: #1a1f26;
      color: #e6e6e6;
      border: 1px solid #2a2f36;
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      font: inherit;
      width: 10ch;
    }
    .controls button {
      background: #4fc3f7;
      color: #0f1419;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 4px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .controls button:hover { background: #29b6f6; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
    }
    th, td {
      text-align: left;
      padding: 0.5rem;
      border-bottom: 1px solid #2a2f36;
    }
    th { color: #888; font-weight: normal; font-size: 0.85rem; text-transform: uppercase; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .loading { color: #888; font-style: italic; }
    .error { color: #ef5350; }

    /* Teams section */
    .team-row { cursor: pointer; }
    .team-row:hover { background: #1a1f26; }
    .team-row td:first-child::before {
      content: "▸";
      display: inline-block;
      width: 1em;
      color: #888;
      transition: transform 0.15s;
    }
    .team-row.expanded td:first-child::before {
      transform: rotate(90deg);
    }
    .squad-row td { padding: 0; border-bottom: none; }
    .squad-inner {
      background: #1a1f26;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #2a2f36;
    }
    .squad-inner h3 {
      margin: 0 0 0.5rem 0;
      font-size: 0.85rem;
      color: #888;
      text-transform: uppercase;
      font-weight: normal;
    }
    .squad-list {
      list-style: none;
      padding: 0;
      margin: 0 0 0.75rem 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.25rem;
    }
    .squad-list li { color: #e6e6e6; font-size: 0.9rem; }
    .squad-list li.bench { color: #888; }
    .badge {
      display: inline-block;
      background: #ffb74d;
      color: #0f1419;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0 0.3rem;
      border-radius: 3px;
      margin-left: 0.25rem;
    }
    .badge.vc { background: #4fc3f7; }
  </style>
</head>
<body>
  <h1>FPL Insights</h1>

  <div class="controls">
    <label for="league-input">League ID:</label>
    <input type="number" id="league-input" min="1" />
    <button id="load-button">Load</button>
  </div>

  <p class="meta" id="meta">Loading…</p>

  <section>
    <h2>Template players (≥70% owned)</h2>
    <table>
      <thead>
        <tr><th>Player</th><th class="num">Owned</th><th class="num">%</th></tr>
      </thead>
      <tbody id="template-body">
        <tr><td colspan="3" class="loading">Loading…</td></tr>
      </tbody>
    </table>
  </section>

  <section>
    <h2>Differentials (5–25% owned)</h2>
    <table>
      <thead>
        <tr><th>Player</th><th class="num">Owned</th><th class="num">%</th></tr>
      </thead>
      <tbody id="differentials-body">
        <tr><td colspan="3" class="loading">Loading…</td></tr>
      </tbody>
    </table>
  </section>

  <section>
    <h2>League standings</h2>
    <table>
      <thead>
        <tr>
          <th>Manager</th>
          <th>Captain</th>
          <th class="num">GW</th>
          <th class="num">Total</th>
        </tr>
      </thead>
      <tbody id="teams-body">
        <tr><td colspan="4" class="loading">Loading…</td></tr>
      </tbody>
    </table>
  </section>

  <script>
    const API = ["localhost", "127.0.0.1"].includes(window.location.hostname)
      ? "http://localhost:8000"
      : "https://fpl-in.fly.dev";

    const DEFAULT_LEAGUE_ID = 314;

    const input = document.getElementById("league-input");
    const button = document.getElementById("load-button");
    const meta = document.getElementById("meta");
    const templateBody = document.getElementById("template-body");
    const diffBody = document.getElementById("differentials-body");
    const teamsBody = document.getElementById("teams-body");

    function getLeagueFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get("league"), 10);
      return Number.isInteger(id) && id > 0 ? id : DEFAULT_LEAGUE_ID;
    }

    function setLeagueInUrl(leagueId) {
      const url = new URL(window.location);
      url.searchParams.set("league", leagueId);
      window.history.replaceState({}, "", url);
    }

    async function load(leagueId) {
      meta.textContent = `Loading league ${leagueId}…`;
      templateBody.innerHTML = `<tr><td colspan="3" class="loading">Loading…</td></tr>`;
      diffBody.innerHTML = `<tr><td colspan="3" class="loading">Loading…</td></tr>`;
      teamsBody.innerHTML = `<tr><td colspan="4" class="loading">Loading…</td></tr>`;

      try {
        const [diffResponse, teamsResponse] = await Promise.all([
          fetch(`${API}/league/${leagueId}/differentials`),
          fetch(`${API}/league/${leagueId}/teams`),
        ]);
        if (!diffResponse.ok) throw new Error(`differentials: HTTP ${diffResponse.status}`);
        if (!teamsResponse.ok) throw new Error(`teams: HTTP ${teamsResponse.status}`);

        const diffData = await diffResponse.json();
        const teamsData = await teamsResponse.json();

        meta.textContent = `Gameweek ${diffData.gameweek} — ${diffData.league_name} (${diffData.total_managers} managers)`;
        renderRows(templateBody, diffData.template);
        renderRows(diffBody, diffData.differentials);
        renderTeams(teamsBody, teamsData.teams);
      } catch (err) {
        meta.innerHTML = `<span class="error">Failed to load league ${leagueId}: ${err.message}</span>`;
        templateBody.innerHTML = "";
        diffBody.innerHTML = "";
        teamsBody.innerHTML = "";
      }
    }

    function renderRows(tbody, players) {
      tbody.innerHTML = "";
      if (players.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="loading">No players in this range.</td></tr>`;
        return;
      }
      for (const p of players) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${p.name}</td>
          <td class="num">${p.count}/${p.total}</td>
          <td class="num">${p.ownership_pct}%</td>
        `;
        tbody.appendChild(tr);
      }
    }

    function renderTeams(tbody, teams) {
      tbody.innerHTML = "";
      if (teams.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="loading">No teams found.</td></tr>`;
        return;
      }
      for (const team of teams) {
        const row = document.createElement("tr");
        row.className = "team-row";
        row.innerHTML = `
          <td>${team.player_name} <span style="color:#888">— ${team.team_name}</span></td>
          <td>${team.captain ?? "—"}</td>
          <td class="num">${team.event_points}</td>
          <td class="num">${team.total_points}</td>
        `;

        const squadRow = document.createElement("tr");
        squadRow.className = "squad-row";
        squadRow.style.display = "none";
        squadRow.innerHTML = `<td colspan="4">${renderSquadHTML(team.squad)}</td>`;

        row.addEventListener("click", () => {
          const isOpen = squadRow.style.display !== "none";
          squadRow.style.display = isOpen ? "none" : "table-row";
          row.classList.toggle("expanded", !isOpen);
        });

        tbody.appendChild(row);
        tbody.appendChild(squadRow);
      }
    }

    function renderSquadHTML(squad) {
      const starters = squad.filter(p => p.position <= 11);
      const bench = squad.filter(p => p.position > 11);
      const playerHTML = (p) => {
        let badge = "";
        if (p.is_captain) badge = `<span class="badge">C</span>`;
        else if (p.is_vice_captain) badge = `<span class="badge vc">VC</span>`;
        return `<li class="${p.position > 11 ? "bench" : ""}">${p.name}${badge}</li>`;
      };
      return `
        <div class="squad-inner">
          <h3>Starting XI</h3>
          <ul class="squad-list">${starters.map(playerHTML).join("")}</ul>
          <h3>Bench</h3>
          <ul class="squad-list">${bench.map(playerHTML).join("")}</ul>
        </div>
      `;
    }

    function handleLoad() {
      const leagueId = parseInt(input.value, 10);
      if (!Number.isInteger(leagueId) || leagueId < 1) {
        meta.innerHTML = `<span class="error">Enter a valid league ID.</span>`;
        return;
      }
      setLeagueInUrl(leagueId);
      load(leagueId);
    }

    button.addEventListener("click", handleLoad);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleLoad();
    });

    const initialLeague = getLeagueFromUrl();
    input.value = initialLeague;
    load(initialLeague);
  </script>
</body>
</html>
